name: release-please

# Keeps one open "release PR" that bumps version.txt and CHANGELOG.md from the
# Conventional Commit PR titles merged to main. Merging that PR creates the
# Git tag and GitHub Release. Jira's matching version is launchpad-<version>.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
